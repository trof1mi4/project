<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Request Headers</title>
</head>
<body>
<h1>Request Headers:</h1>
<table border="1">
    <tr>
        <th>Header Name</th>
        <th>Header Value</th>
    </tr>
    <tr th:each="header : ${headers}">
        <td th:text="${header.key}"></td>
        <td th:text="${header.value}"></td>
    </tr>
</table>
</body>
</html>
